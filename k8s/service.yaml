---
apiVersion: v1
kind: Service
metadata:
  name: route-optimizer-api
  namespace: route-optimizer
  labels:
    app: route-optimizer
  annotations:
    # Optional cloud provider specific annotations:
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # cloud.google.com/backend-config: '{"default": "route-optimizer-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: route-optimizer
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

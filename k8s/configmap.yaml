---
apiVersion: v1
kind: ConfigMap
metadata:
  name: route-optimizer-config
  namespace: route-optimizer
data:
  # Application settings
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "False"
  REQUEST_TIMEOUT: "30"

  # Feature flags
  ENABLE_METRICS: "True"
  LOG_LEVEL: "INFO"

  # Road network selection (future use for multi-region deployments)
  DEFAULT_REGION: "NSW"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: route-optimizer-ingress
  namespace: route-optimizer
  annotations:
    # AWS ALB controller (if applicable)
    # kubernetes.io/ingress.class: "alb"
    # alb.ingress.kubernetes.io/scheme: "internet-facing"
    # nginx ingress controller specifics:
    # nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - routes.yourdomain.com  # Replace with your domain
      secretName: route-optimizer-tls
  rules:
    - host: routes.yourdomain.com  # Replace with your domain or IP for dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: route-optimizer-api
                port:
                  number: 80